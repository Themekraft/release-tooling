# git-cliff config: release notes from Conventional Commits.
[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Only stable tags count as releases: the notes of a stable cover everything since the previous stable,
# and a beta lists what is new since the last stable.
tag_pattern = "^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^(build|chore)\\(deps\\)", group = "<!-- 3 -->Dependencies" },
  { message = "^docs", skip = true },
  { message = "^(build|chore|ci|style|test|refactor)", skip = true },
]
