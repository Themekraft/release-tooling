# Reusable CI for ThemeKraft plugins: PHP syntax on the oldest and newest
# supported PHP, and WordPress Plugin Check on the built zip.
name: ci

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      php-versions:
        description: JSON list of PHP versions for the syntax check.
        required: false
        type: string
        default: '["7.4", "8.4"]'
      plugin-check:
        description: Run WordPress Plugin Check (wp.org products).
        required: false
        type: boolean
        default: true
      plugin-check-blocking:
        description: Fail the CI when Plugin Check reports errors. Set to false only while a product pays down a known backlog; the results are still reported.
        required: false
        type: boolean
        default: true
      build-command:
        description: Command that builds the plugin's assets before packaging (for example "pnpm install --frozen-lockfile && pnpm run build"). Node and pnpm are installed only when it is set.
        required: false
        type: string
        default: ""
      node-version:
        required: false
        type: string
        default: "22"
      tooling-ref:
        required: false
        type: string
        default: main
    secrets:
      CHECKOUT_TOKEN:
        required: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './.tk/*' -print0 \
            | xargs -0 -n1 -P4 php -l -d display_errors=1 > /dev/null

  plugin-check:
    if: inputs.plugin-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
      - uses: actions/checkout@v7
        with:
          repository: Themekraft/release-tooling
          ref: ${{ inputs.tooling-ref }}
          path: .release-tooling
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
      - uses: pnpm/action-setup@v6
        # pnpm version comes from the product's package.json "packageManager" field.
        if: inputs.build-command != ''
      - uses: actions/setup-node@v7
        if: inputs.build-command != ''
        with:
          node-version: ${{ inputs.node-version }}
      - name: Build assets
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
      - name: Build
        run: .release-tooling/bin/build-zip "${{ inputs.slug }}" . .release-build
      - name: Plugin Check
        id: plugin-check
        uses: wordpress/plugin-check-action@v1
        # Always continue: the next step decides whether errors fail the job.
        # A continue-on-error expression on this composite action did not apply reliably.
        continue-on-error: true
        with:
          build-dir: .release-build/${{ inputs.slug }}
          # The action comments a "Failed" summary on the PR when it has a token. Only
          # let it do that where errors block; elsewhere the green CI would contradict it.
          repo-token: ${{ inputs.plugin-check-blocking && github.token || '' }}
      - name: Fail on Plugin Check errors
        if: steps.plugin-check.outcome == 'failure'
        env:
          BLOCKING: ${{ inputs.plugin-check-blocking }}
        run: |
          if [[ "$BLOCKING" == "true" ]]; then
            echo "::error::Plugin Check reported errors (see the annotations above)."
            exit 1
          fi
          echo "::warning::Plugin Check reported errors; not blocking for this repository (plugin-check-blocking: false)."
